# yaml-language-server: $schema=./schemas/repos.schema.json
# Repositories of the sublimelsp organization.
#
# Each entry only lists values that differ from `defaults`. See README.md for the available keys.

defaults:
  visibility: public
  has_issues: true
  has_projects: false
  has_wiki: false
  has_discussions: false
  allow_merge_commit: false
  allow_squash_merge: true
  allow_rebase_merge: true
  allow_auto_merge: false
  allow_update_branch: true
  delete_branch_on_merge: true
  archived: false
  protect_default_branch: true
  require_linear_history: false
  actions_enabled: true
  actions_allowed: all

repos:
  infra:
    description: Infrastructre for managing sublimelsp organisation
    required_status_checks:
      - terraform
  LSP-anakin:
    description: Convenience package for anakin-language-server
    archived: true
  LSP-angular:
    description: Convenience plugin for Angular Language Service
    required_status_checks:
    - Smoke test result
    collaborators:
      princemaple: maintain
  LSP-ast-grep:
    description: ast-grep support for Sublime's LSP plugin
  LSP-astro:
    description: Astro support for Sublime's LSP plugin
    required_status_checks:
    - smoke / Smoke test result
  LSP-basedpyright:
    description: Python support for Sublime's LSP plugin provided through DetachHead/basedpyright.
    collaborators:
      jfcherng: admin
    required_status_checks:
